<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/coins.css">
    <link rel="stylesheet" href="css/bottom-ui.css">
    <link rel="stylesheet" href="css/messege-window.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>
    <main>
        <div id="ui">
            <div id="counters">
                <p id="playerBankCounter">BANK: 1000$</p>
                <p id="gameBankCounter">BET: 0$</p>
            </div>
        </div>
        <div id="lands">
            <div id="dealerLand"></div>
            <div id="playerLand"></div>
        </div>
        <div id="bottomUi">
            <div id="coins">
                <button class="coinBtn" id="coin5">5</button>
                <button class="coinBtn" id="coin25">25</button>
                <button class="coinBtn" id="coin50">50</button>
                <button class="coinBtn" id="coin100">100</button>
                <button class="coinBtn" id="coin500">500</button>
            </div>
            <div id="mainButtons">
                <button class="mainBtn" id="hitBtn">HIT</button>
                <button class="mainBtn" id="splitBtn">SPLIT</button>
                <button class="mainBtn" id="standBtn">STAND</button>
            </div>
            
        </div>
    </main>
</body>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/card.js"></script>
<script type="module" src="js/random-number.js"></script>
</html>
