<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/coins.css">
    <link rel="stylesheet" href="css/bottom-ui.css">
    <link rel="stylesheet" href="css/messege-window.css">
    <link rel="stylesheet" href="css/card.css">
    <link rel="stylesheet" href="css/ui.css">
</head>
<body>
    <main>
        <div id="ui">
            <div id="playerBlock">
                <img id="profileLogo" src="./img/user_logos/user_default.avif">
                <div id="counterBg">
                    <span id="playerCounter">1000$</span>
                </div>
            </div>
        </div>
        <div id="landUi">
            <span id="betCounter">BET: 0$</span>
            <span class="pointsCounter" id="pointsDealer">21</span>
            <div id="lands">
                <div id="dealerLand"></div>
                <div id="playerLand"></div>
            </div>
            <span class="pointsCounter" id="pointsPlayer">21</span>
        </div>
        <div id="bottomUi">
            <div id="coinsBar">
                <button class="coinBtn" id="coin25">25</button>
                <button class="coinBtn" id="coin50">50</button>
                <button class="coinBtn" id="coin100">100</button>
                <button class="coinBtn" id="coin250">250</button>
                <button class="coinBtn" id="coin500">500</button>
            </div>
            <div id="mainButtons">
                <button class="mainBtn" id="hitBtn">
                    <span class="btnText">HIT</span>
                </button>
                <button class="mainBtn" id="doubleBtn">
                    <span class="btnText">DOUBLE</span>
                </button>
                <button class="mainBtn" id="splitBtn">
                    <span class="btnText">SPLIT</span>
                </button>
                <button class="mainBtn" id="standBtn">
                    <span class="btnText">STAND</span>
                </button>
            </div>
            
        </div>
    </main>
</body>
<script type="module" src="js/main.js"></script>
<script type="module" src="js/card.js"></script>
<script type="module" src="js/random-number.js"></script>
<script type="module" src="js/points-render.js"></script>
</html>
